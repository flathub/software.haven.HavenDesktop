app-id: software.haven.HavenDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: haven-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=com.canonical.Unity

modules:
  - name: haven-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/haven-desktop/pnpm-cli/bin
      env:
        XDG_CACHE_HOME: /run/build/haven-desktop/flatpak-node/cache
        PNPM_HOME: /run/build/haven-desktop/flatpak-node/pnpm-home
        HOME: /run/build/haven-desktop
        COREPACK_ENABLE_STRICT: '0'
        PNPM_CONFIG_PM_ON_FAIL: ignore
        npm_config_pm_on_fail: ignore
        NX_NO_CLOUD: 'true'
        NX_SKIP_NX_CACHE: 'true'
        NX_DAEMON: 'false'
    build-commands:
      - bash flatpak/build.sh
    sources:
      - type: git
        url: https://github.com/Haven-Organization/haven-desktop
        tag: haven-v0.10.0
        commit: 52fcec4d64a1654d5c060fd17f207728270ed024
      - generated-sources.json
      - element-call-sources.json
      - matrix-seshat-cargo-sources.json
      - type: script
        dest: pnpm-cli/bin
        dest-filename: pnpm
        commands:
          - "#!/bin/sh"
          - exec /run/build/haven-desktop/pnpm-cli/package/pnpm "$@"
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
        sha256: eb57341b8b54fddaeededb15dbb77cc30a11750cecca301bfda02478fdff3a00
        dest-filename: pnpm-12.11.2.tgz
      - type: file
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
        sha256: 79008d3130845ee8a0fe4381e6b81815e80e1bd411702f34721b1cc63e6e20bf
        dest-filename: pnpm-exe-12.11.2.tgz
      - type: file
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.11.2.tgz
        sha256: c9b5d1a2a254f4593a6fbd878bbbbc81dce4fb36b1c850cc8f31031dbb08ffdb
        dest-filename: pnpm-exe-12.11.2.tgz
