app-id: software.haven.HavenDesktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: haven-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=com.canonical.Unity

modules:
  - name: haven-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/haven-desktop/pnpm-cli/bin
      env:
        XDG_CACHE_HOME: /run/build/haven-desktop/flatpak-node/cache
        PNPM_HOME: /run/build/haven-desktop/flatpak-node/pnpm-home
        HOME: /run/build/haven-desktop
        COREPACK_ENABLE_STRICT: '0'
        PNPM_CONFIG_PM_ON_FAIL: ignore
        npm_config_pm_on_fail: ignore
        NX_NO_CLOUD: 'true'
        NX_SKIP_NX_CACHE: 'true'
        NX_DAEMON: 'false'
    build-commands:
      - bash flatpak/build.sh
    sources:
      - type: git
        url: https://github.com/Haven-Organization/haven-desktop
        tag: haven-v0.12.0
        commit: 21ad9bb2014ba4a3dde94104097650f17cef30eb
      - generated-sources.json
      - matrix-seshat-cargo-sources.json
      - type: script
        dest: pnpm-cli/bin
        dest-filename: pnpm
        commands:
          - "#!/bin/sh"
          - exec /run/build/haven-desktop/pnpm-cli/package/pnpm "$@"
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.21.0.tgz
        sha256: 0791469382b579869c51827759876616bc3eae5296d8fa880bbc3c9c1e8cf6f7
        dest-filename: pnpm-12.21.0.tgz
      - type: file
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.21.0.tgz
        sha256: 5e853227a4fa387a95cf6f61400a83d1fc7e3164943c00e275f8756b75939de2
        dest-filename: pnpm-exe-12.21.0.tgz
      - type: file
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.21.0.tgz
        sha256: 0726f98c09f0f0fe6fb91e376c4d3e7793a544c1f1ec3e20baaeb2bb91c47e1f
        dest-filename: pnpm-exe-12.21.0.tgz
      - type: file
        url: https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz
        sha256: dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157
        dest-filename: ruffle-0.7.1.tgz
