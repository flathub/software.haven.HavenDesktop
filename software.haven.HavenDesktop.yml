app-id: software.haven.HavenDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: haven-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=com.canonical.Unity

modules:
  - name: haven-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/haven-desktop/pnpm-cli/bin
      env:
        XDG_CACHE_HOME: /run/build/haven-desktop/flatpak-node/cache
        PNPM_HOME: /run/build/haven-desktop/flatpak-node/pnpm-home
        HOME: /run/build/haven-desktop
        COREPACK_ENABLE_STRICT: '0'
        PNPM_CONFIG_PM_ON_FAIL: ignore
        npm_config_pm_on_fail: ignore
        NX_NO_CLOUD: 'true'
        NX_SKIP_NX_CACHE: 'true'
        NX_DAEMON: 'false'
    build-commands:
      - bash flatpak/build.sh
    sources:
      - type: git
        url: https://github.com/Haven-Organization/haven-desktop
        tag: haven-v0.8.1
        commit: 4b0a47bced4f865ef347f7ca5c71eaf2683e07a0
      - generated-sources.json
      - type: script
        dest: pnpm-cli/bin
        dest-filename: pnpm
        commands:
          - "#!/bin/sh"
          - exec node /run/build/haven-desktop/pnpm-cli/package/bin/pnpm.mjs "$@"
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.23.0.tgz
        sha256: 78dcbf44f40cef50d1f4b535ca9961a30edb4b13c420c360bf4068d424a41bc4
        dest-filename: pnpm-11.23.0.tgz
      - matrix-seshat-cargo-sources.json
      - matrix-seshat-yarn-sources.json
      - type: file
        url: https://registry.npmjs.org/yarn/-/yarn-1.22.22.tgz
        sha256: c17d3797fb9a9115bf375e31bfd30058cac6bc9c3b8807a3d8cb2094794b51ca
        dest-filename: yarn-1.22.22.tgz
      - type: archive
        url: https://registry.npmjs.org/matrix-seshat/-/matrix-seshat-5.0.0.tgz
        sha256: 3c18369a320098b17e2539226d0e96619c9be4693186f376ed11b077a27c95ca
        dest: element-web/apps/desktop/.hak/matrix-seshat/x86_64-unknown-linux-gnu/build
      - type: archive
        url: https://registry.npmjs.org/matrix-seshat/-/matrix-seshat-5.0.0.tgz
        sha256: 3c18369a320098b17e2539226d0e96619c9be4693186f376ed11b077a27c95ca
        dest: element-web/apps/desktop/.hak/hakModules/matrix-seshat
      - type: file
        path: matrix-seshat-yarn.lock
        dest: element-web/apps/desktop/.hak/matrix-seshat/x86_64-unknown-linux-gnu/build
        dest-filename: yarn.lock
