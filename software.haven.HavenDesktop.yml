app-id: software.haven.HavenDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: haven-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=com.canonical.Unity

modules:
  - name: haven-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/haven-desktop/pnpm-cli/bin
      env:
        XDG_CACHE_HOME: /run/build/haven-desktop/flatpak-node/cache
        PNPM_HOME: /run/build/haven-desktop/flatpak-node/pnpm-home
        HOME: /run/build/haven-desktop
        COREPACK_ENABLE_STRICT: '0'
        PNPM_CONFIG_PM_ON_FAIL: ignore
        npm_config_pm_on_fail: ignore
        NX_NO_CLOUD: 'true'
        NX_SKIP_NX_CACHE: 'true'
        NX_DAEMON: 'false'
    build-commands:
      - bash flatpak/build.sh
    sources:
      - type: git
        url: https://github.com/Haven-Organization/haven-desktop
        tag: haven-v0.11.0
        commit: d95c2468a06fbc256e0ca38122da7175af0cf351
      - generated-sources.json
      - element-call-sources.json
      - matrix-seshat-cargo-sources.json
      - type: script
        dest: pnpm-cli/bin
        dest-filename: pnpm
        commands:
          - "#!/bin/sh"
          - exec /run/build/haven-desktop/pnpm-cli/package/pnpm "$@"
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.14.0.tgz
        sha256: ea206e35474bf87be9564a85ca70ed1c8ebdc45da55aafb0a3bf09d1ba69b179
        dest-filename: pnpm-12.14.0.tgz
      - type: file
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.14.0.tgz
        sha256: 1de98ed2e9621113b0887b06322b461efb9df73d913fc1d151039b10b7117a41
        dest-filename: pnpm-exe-12.14.0.tgz
      - type: file
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.14.0.tgz
        sha256: e7ca24224eb626a032828ec584c67903ad2f389911b849d009ed70a19f70d8d3
        dest-filename: pnpm-exe-12.14.0.tgz
      - type: file
        url: https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz
        sha256: dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157
        dest-filename: ruffle-0.7.1.tgz
